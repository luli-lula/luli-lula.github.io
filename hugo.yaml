# The site moved to https://ailula.top (ailula-site repo, 2026-11). This old blog stays here as an archive,
# out of search results: its posts live on at ailula.top, and duplicates would compete with them.
baseURL: https://luli-lula.github.io/
cascade:
  robotsNoIndex: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
theme: PaperMod
canonifyURLs: false 

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "projects", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

languages:
  en:
    languageName: "English"
    languageCode: en-us
    title: "lula's blog"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 20
        - name: Projects
          url: projects/
          weight: 15
        - name: About
          url: about/
          weight: 30
    params:
      languageAltTitle: English
      description: "the private space for lula"
      profileMode:
        enabled: true
        title: lula
        imageUrl: "https://raw.githubusercontent.com/googlefonts/noto-emoji/master/svg/emoji_u1f469_1f3fb_200d_1f4bb.svg"
        imageTitle: ProfileMode image
        subtitle: "🦌Indie Maker | 📱 ex-Product Manager | 👩🏻‍💻 Learning to code| 🌲 Loving Nature"
        buttons:
          - name: Projects
            url: projects/
          - name: Blog
            url: posts
          - name: Movies
            url: movies/
          - name: Books
            url: books/
          - name: Floating Thoughts
            url: https://v0-floating-thoughts.vercel.app/

  zh:
    languageName: "中文"
    languageCode: zh-cn
    title: "lula的博客"
    weight: 2
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: 归档
          url: archives
          weight: 5
        - name: 搜索
          url: search/
          weight: 10
        - name: 标签
          url: tags/
          weight: 20
        - name: 项目
          url: projects/
          weight: 15
        - name: 关于
          url: about/
          weight: 30
    params:
      languageAltTitle: 中文
      description: "lula的私人空间"
      profileMode:
        enabled: true
        title: lula
        imageUrl: "https://raw.githubusercontent.com/googlefonts/noto-emoji/master/svg/emoji_u1f469_1f3fb_200d_1f4bb.svg"
        imageTitle: ProfileMode image
        subtitle: "🦌独立开发者 | 📱前产品经理 | 👩🏻‍💻学习编程中 | 🌲热爱自然"
        buttons:
          - name: 项目
            url: projects/
          - name: 博客
            url: posts
          - name: 电影
            url: movies/
          - name: 书籍
            url: books/
          - name: 浮动想法
            url: https://v0-floating-thoughts.vercel.app/



outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "the private space for lula"
  author: lula

  defaultTheme: auto
